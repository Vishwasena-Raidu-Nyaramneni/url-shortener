spring:
  application:
    name: url-shortener
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  cache:
    type: caffeine
    caffeine:
      spec: "maximumSize=100000,expireAfterWrite=5m"

app:
  base-url: http://localhost:8080

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-stacktrace: never
    whitelabel:
      enabled: false
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
    static-resource-locations: "classpath:/static/"
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

logging:
  level:
    root: INFO
    com.vishwasena.urlshortener: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
